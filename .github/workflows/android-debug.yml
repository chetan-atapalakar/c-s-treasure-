name: Build Android debug APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Install Android packages (kept out of package.json)
        run: npm install --no-save @capacitor/core@7 @capacitor/app@7 @capacitor/status-bar@7 @capacitor/splash-screen@7 @capacitor/android@7 @capacitor/cli@7 @capacitor/assets@3
      - name: Build web bundle for Android
        run: npx vite build -c vite.config.android.js
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Create and sync Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cus-treasure-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
